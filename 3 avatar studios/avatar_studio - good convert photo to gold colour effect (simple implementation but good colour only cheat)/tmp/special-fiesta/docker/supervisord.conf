; Two services, one container (ADR-043): the app and its cloudflared tunnel share a network
; namespace, so the tunnel reaches the API on 127.0.0.1 and nothing else needs exposing.
; supervisord stays in the foreground as PID 1 and mirrors both programs to the container
; log stream — `docker logs` is the single place to look.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:app]
command=/app/docker/app.sh
directory=/app
priority=10
autorestart=true
startsecs=5
; ADR-118 — the app may only end its own process where something will start it again, and
; here that is us: `autorestart=true` above is the promise this flag reports to the console.
; Nothing else sets it, so `npm run dev` correctly reports the restart button as unavailable.
environment=PROCESS_SUPERVISED="true"
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cloudflared]
command=/app/docker/cloudflared.sh
priority=20
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
