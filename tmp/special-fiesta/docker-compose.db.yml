# A Postgres server on its own, for developing against the real thing (ADR-051).
#
#   docker compose -f docker-compose.db.yml up -d
#   DATABASE_URL=postgresql://psd:psd@127.0.0.1:5432/psd_active_day npm run dev
#
# That second line is the whole integration: `DATABASE_URL` alone selects the server driver, and the
# app provisions an empty database from snapshot.sql on its first boot, so there is no setup step
# between starting this container and having a working event.
#
# Nothing here is a secret worth protecting — it listens on localhost with a throwaway password —
# and nothing in it is used for deployment. `docker-compose.yml` is the deployment story.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psd
      POSTGRES_PASSWORD: psd
      POSTGRES_DB: psd_active_day
    ports:
      # Bound to loopback on purpose: a database with a password of "psd" has no business being
      # reachable from the rest of the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - psd-pg-dev:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers once the server accepts connections, which is what "up" has to mean
      # before anything tries to provision a schema.
      test: ["CMD-SHELL", "pg_isready -U psd -d psd_active_day"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  psd-pg-dev:
